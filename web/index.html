<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пульк">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F5">
<title>Пульк в браузере</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* the design system «Пульк»: light and dark */
  :root { --bg: #EEF3F5; --panel: #FFFFFF; --ink: #0F1E26; --muted: #4A5B64; --accent: #0A6680; --on-accent: #FFFFFF;
    --line: #7F929C; --petal: #FFFFFF; --press: #CFE8F0; --zone: #E6F3F7; --glass: rgba(15,30,38,0.08); --urgent: #A8321F; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1114; --panel: #1B262C; --ink: #EDF3F6; --muted: #A3B4BC; --accent: #4CC2DE; --on-accent: #032029;
    --line: #5E737D; --petal: #1B262C; --press: #244A5B; --zone: #1E3944; --glass: rgba(255,255,255,0.08); --urgent: #FF8A75; color-scheme: dark; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 Roboto, system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #screen { flex: 1; min-height: 0; overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); -webkit-user-select: none; user-select: none; }
  h1 { font-size: 22px; line-height: 1.25; margin: 4px 0 6px; } h2 { font-size: 17px; margin: 16px 0 6px; }
  .note { margin: 0 0 8px; color: var(--muted); font-size: 16px; }
  #text .fixed { background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 0 4px; margin: 0 -4px; }
  #text .rest { color: var(--muted); font-weight: 400; opacity: 0.6; }
  ul.tips { padding-left: 20px; margin: 4px 0; } ul.tips li { margin: 6px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  #text { min-height: 72px; font-size: 26px; font-weight: 600; padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); word-wrap: break-word; }
  #text:empty::before { content: attr(data-hint); color: var(--muted); font-weight: 400; }
  #text .caret { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 16px; cursor: pointer; }
  button.main { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  button.wide { width: 100%; margin-top: 8px; }
  .scroll button { flex: 0 0 auto; }
  .compose { position: sticky; bottom: -8px; z-index: 1; background: var(--bg); padding: 6px 0 8px; box-shadow: 0 8px 0 var(--bg); }   /* no heading peeks out under it */
  .row.acts { display: grid; grid-template-columns: repeat(4, 1fr) 44px; gap: 6px; } .row.acts button.kb { padding: 0; font-size: 20px; } .row.acts button { padding: 0 4px; font-size: 15px; white-space: nowrap; }
  @media (max-width: 400px) { .row.acts button { font-size: 14px; } }   /* «★ В мои» stays on one line on a narrow phone */
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .picks button { min-height: 52px; padding: 4px 8px; line-height: 1.2; }
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .answers button { min-height: 52px; padding: 0 4px; font-weight: 600; }
  button.urgent { color: var(--urgent); border-color: var(--urgent); font-weight: 700; }
  .line { display: flex; gap: 6px; align-items: flex-end; } .line .wide { flex: 1; }
  button.x { min-width: 48px; padding: 0; color: var(--muted); }
  button.main.x { color: var(--on-accent); }   /* «→» in «Разговор»: readable on the accent */
  .choice { border-color: var(--accent); } .cq { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .choices button { min-height: 72px; font-size: 22px; font-weight: 700; }
  button.quiet { color: var(--muted); border-style: dashed; }
  button.big { flex: 1; min-height: 96px; font-size: 26px; }
  .card .title { font-weight: 700; }
  #screen > .title { font-weight: 700; margin-top: 16px; }   /* a setting's name in «Удобство», apart from the buttons above */
  input[type=text], textarea { width: 100%; margin-top: 8px; font: inherit; min-height: 48px; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; -webkit-user-select: text; user-select: text; }
  /* the first visit: no keyboard yet, only the welcome */
  body.welcome #chips, body.welcome #tabs, body.welcome #kbd { display: none; }
  body.nostar #chips, body.nostar #kbd, body.syskbd #kbd { display: none; }
  #text input.sys { margin: 0; padding: 0; border: 0; min-height: 0; background: transparent; font: inherit; color: inherit; outline: none; }
  .hello { display: flex; gap: 14px; align-items: center; margin: 4px 0 4px; }
  .hello img { width: 60px; height: 60px; border-radius: 16px; }
  .hello h1 { font-size: 30px; margin: 0; } .hello .note { margin: 2px 0 0; }
  .card h2 { margin-top: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .pair button { min-height: 56px; font-size: 18px; }
  button.pic { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; }
  button.pic img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  .choices button.pic img { width: 88px; height: 88px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .tiles button { min-height: 72px; font-weight: 600; }
  .grow { flex: 1; min-width: 0; padding: 12px 0; }
  /* «Разговор»: the adult's words on the left, the child's on the right, big */
  .feed { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .feed .day { align-self: center; color: var(--muted); font-size: 13px; }
  button.bubble { max-width: 85%; min-height: 0; padding: 10px 14px; text-align: left; font-size: 22px; line-height: 1.3; border-radius: 18px; }
  button.bubble.you { align-self: flex-start; border-bottom-left-radius: 6px; font-weight: 600; }
  button.bubble.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-color: var(--accent); border-bottom-right-radius: 6px; font-weight: 700; }
  .line input[type=text] { margin-top: 0; flex: 1; min-width: 0; }
  /* «Пузыри» */
  .pond-area { display: grid; place-items: center; min-height: 170px; }
  .bubble-l { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; font-size: 68px; font-weight: 800; color: var(--ink);
    background: radial-gradient(circle at 35% 30%, var(--panel), var(--zone) 60%, var(--press)); border: 2px solid var(--accent); animation: float 3.2s ease-in-out infinite; }
  .bubble-l.pop { animation: pop .38s ease-out forwards; }
  .bubble-l.wobble { animation: wobble .4s ease-in-out; }
  .bubble-l.word { width: auto; min-width: 120px; height: 96px; padding: 0 24px; border-radius: 48px; font-size: 40px; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; }
  .pond-area.words { min-height: 120px; }
  .bubble-l.word .got { color: var(--accent); }
  .bubble-l.word .bad { color: var(--urgent); text-decoration: underline wavy; text-underline-offset: 6px; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes pop { to { transform: scale(1.5); opacity: 0; } }
  @keyframes wobble { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #kbd .petal, #kbd .drop { transition: transform .09s ease-out; }
  @media (prefers-reduced-motion: reduce) { #kbd .petal, #kbd .drop { transition: none; } .bubble-l, .bubble-l.wobble { animation: none; } .bubble-l.pop { animation-duration: .01s; } }
  .warn { color: var(--urgent); font-size: 14px; margin: 6px 0; }
  /* «Крупный текст» */
  body.big-text #screen { font-size: 19px; } body.big-text h1 { font-size: 27px; } body.big-text #text { font-size: 32px; }
  body.big-text button { font-size: 18px; } body.big-text .muted, body.big-text .note { font-size: 17px; }
  button.answer { min-height: 60px; font-size: 19px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
  .ok { color: var(--accent); font-weight: 700; min-height: 24px; margin-top: 8px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px max(12px, env(safe-area-inset-left, 0px)); min-height: 60px; align-items: center; scrollbar-width: none; }
  #chips:empty { min-height: 0; padding: 0; }
  #chips button { flex: 0 0 auto; border-radius: 24px; }
  /* «Сказать» right above the thumb: at the star's side of the row, and it stays there when the words scroll */
  #chips button.main { order: 99; margin-left: auto; position: sticky; right: 0; min-width: 120px; box-shadow: -10px 0 0 var(--bg); }
  body.left-hand #chips button.main { order: -1; margin-left: 0; right: auto; left: 0; box-shadow: 10px 0 0 var(--bg); }
  #tabs { display: flex; gap: 4px; padding: 0 max(8px, env(safe-area-inset-left, 0px)); }
  #tabs button { flex: 1 1 auto; min-width: 52px; min-height: 48px; padding: 0 4px; font-size: 14px; border-radius: 12px; }
  @media (max-width: 380px) { #tabs button { font-size: 13px; } }   /* five tabs on a narrow phone, none under 52 px */
  /* «Настройки» — always in sight, on every screen with the tabs: a gear with its name under it */
  #tabs button.gear { flex: 0 0 auto; min-width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.1; }
  #tabs button.gear b { font-size: 20px; font-weight: 400; } #tabs button.gear small { font-size: 11px; }
  #tabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #kbd { touch-action: none; display: block; width: 100%; flex: 0 0 auto; }
  #big { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 5; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
  #big p { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 48px; font-weight: 800; margin: 0; }
  #big.flip p { transform: rotate(180deg); }
  .dots { color: var(--muted); } .dots b { letter-spacing: 6px; font-weight: 400; margin-right: 8px; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="chips"></div>
<div id="tabs">
  <button data-tab="speak">Говорить</button><button data-tab="lesson">Учиться</button><button data-tab="drills">Тренировки</button><button data-tab="pond">Пруд</button><button data-tab="settings" class="gear"><b aria-hidden="true">⚙</b><small>Настройки</small></button>
</div>
<svg id="kbd" role="img" aria-label="Звезда для набора: смах от центра к букве"></svg>
<div id="big"><p id="bigText"></p><div class="row" style="padding-bottom:12px"><button id="flip" style="flex:1">Перевернуть</button><button id="back" class="main" style="flex:1">Вернуться</button></div></div>
<script src="data.js"></script>
<script src="stopwords.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script src="../pulk-sound.js"></script>
<script>
  // without internet too: the site's service worker keeps Пульк's files after the first visit (a shop, a metro, a hospital)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', function () {
    const files = ['./', 'index.html', 'data.js', 'core.js', 'app.js', 'next_ru.txt', '../../dict_ru.txt', '../icon.png', '../icon.svg', '../icon-180.png', '../icon-192.png', '../icon-512.png', 'manifest.webmanifest', '../pulk-sound.js'];
    function warm() { files.forEach(function (u) { fetch(u).catch(function () {}); }); }
    navigator.serviceWorker.register('../../sw.js', { scope: '../../' }).then(function () {
      // once in control, every load goes through it and is kept; only the very first visit needs filling in
      if (!navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener('controllerchange', warm, { once: true });
    }).catch(function () {});
  });
</script>
</body>
</html>
