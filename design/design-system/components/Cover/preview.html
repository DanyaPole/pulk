<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:var(--petal,#FFFFFF)}
.wrap{position:relative;width:960px;height:288px;overflow:hidden;font-family:Roboto,system-ui,sans-serif}
.name{position:absolute;left:40px;bottom:64px;margin:0;font-size:120px;line-height:.92;font-weight:700;color:var(--ink,#0F1E26);letter-spacing:-0.02em}
.tag{position:absolute;left:40px;bottom:36px;margin:0;max-width:440px;font-size:14px;color:var(--ink-muted,#4A5B64)}
.accent{fill:var(--accent,#0A6680)}
.ground{fill:var(--icon-ground,#0E1A20)}
.tint{fill:var(--press,#CFE8F0)}
.zone{fill:var(--coach-zone,#E6F3F7)}
.pet{fill:var(--icon-petal,#4CC2DE);stroke:var(--icon-petal,#4CC2DE);stroke-width:6;stroke-linejoin:round}
.hi{fill:#FFFFFF;stroke:#FFFFFF;stroke-width:6;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
<svg width="960" height="288" viewBox="0 0 960 288" style="position:absolute;left:0;top:0" aria-hidden="true">
<!-- blocks: icon-ground 300x288 (bleeds top/bottom/right), accent 120x200 (radius-pill 24), press 120x64, coach-zone 60x60
     arrangement: one tall dark slab with satellites to its left, slab bleeding off the right edge
     pattern: literal motif — the 8-petal star of the icon (petal-gap 4, radius-petal 5), one petal lit as a swipe: the brand is the star
     steps/radii: chip-gap 8, chip-height 48, radius-pill 24, radius-petal 5 -->
<rect class="accent" x="508" y="24" width="120" height="200" rx="24"></rect>
<rect class="tint" x="508" y="232" width="120" height="64" rx="24"></rect>
<rect class="zone" x="560" y="-24" width="60" height="40" rx="20"></rect>
<rect class="ground" x="660" y="-8" width="320" height="304" rx="24"></rect>
<g transform="translate(810 144) scale(2.4) translate(-54 -54)">
<path class="pet" transform="rotate(0 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="hi" transform="rotate(45 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="pet" transform="rotate(90 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="pet" transform="rotate(135 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="pet" transform="rotate(180 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="pet" transform="rotate(225 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="pet" transform="rotate(270 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<path class="pet" transform="rotate(315 54 54)" d="M46.81 24.88 L51.58 24.10 L54 24 L56.42 24.10 L61.19 24.88 L56.12 37.13 L54 37 L51.88 37.13 Z"></path>
<circle cx="54" cy="54" r="6" fill="#FFFFFF"></circle>
</g>
</svg>
<h1 class="name">Пульк</h1>
<p class="tag">Набор одной рукой: звезда у пальца, всё остальное — воздух.</p>
</div>
</body>
</html>
