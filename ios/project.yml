name: Pulk
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pulk:
    type: application
    platform: iOS
    sources:
      - path: Pulk
      - path: PulkKeyboard/PulkBridge.swift
      - path: PulkKeyboard/StarView.swift
      - path: PulkKeyboard/KeyboardSettings.swift
      - path: ../web/core.js
        buildPhase: resources
      - path: ../web/data.js
        buildPhase: resources
      - path: ../web/stopwords.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulk.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: PulkKeyboard
        embed: true
        codeSign: false
    scheme:
      testTargets:
        - PulkTests
  PulkKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: PulkKeyboard
      - path: ../web/core.js
        buildPhase: resources
      - path: ../web/data.js
        buildPhase: resources
      - path: ../web/stopwords.js
        buildPhase: resources
      - path: ../web/dict_ru.txt
        buildPhase: resources
      - path: ../web/dict_en.txt
        buildPhase: resources
      - path: ../web/next_ru.txt
        buildPhase: resources
      - path: ../web/next_en.txt
        buildPhase: resources
    info:
      path: PulkKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Пульк
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: ru-RU
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulk.ios.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # Logic test: no application dependency, so XcodeGen does not set TEST_HOST.
  # PulkKeyboard sources are not linked. If the runner rejects a hostless iOS
  # test, add: dependencies: [{target: Pulk}]
  PulkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulkTests
      - path: ../web/core.js
        buildPhase: resources
      - path: ../web/data.js
        buildPhase: resources
      - path: ../web/stopwords.js
        buildPhase: resources
      # optional: a missing file must not fail `xcodegen` in the ipa job.
      # When the file exists at generate time it is copied into the test bundle.
      - path: ../shared/strokes.golden.json
        buildPhase: resources
      - path: ../web/dict_ru.txt
        buildPhase: resources
      - path: ../web/next_ru.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulk.ios.tests
        GENERATE_INFOPLIST_FILE: YES
